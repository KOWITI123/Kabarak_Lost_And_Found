<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report Found Item</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="report.css">
</head>
<body>

<header class="top-header">
  <div class="header-content">
    <div class="logo-area">
      <img src="img/logo.jfif" alt="Kabarak Logo">
      <h2>Report Found Item</h2>
    </div>
  </div>
</header>

<main class="container">

  <div class="info-box">
    <p>
      Thank you for choosing to do the right thing. By reporting a found item, you are helping someone recover what they lost. 
      Please provide accurate details below so the item can safely reach its rightful owner.
    </p>
  </div>

  <form class="form-card">
    <label>Item Name</label>
    <input type="text" placeholder="e.g. Laptop, ID card, Keys" required>

    <label>Description</label>
    <textarea rows="4" placeholder="Describe the item and where you found it..." required></textarea>

    <label>Your Phone Number</label>
    <input type="tel" placeholder="e.g. 07XXXXXXXX" required>
  <label>Upload an Image (optional)</label>
  <input type="file" accept="image/*">
  <small>You can upload a photo of the item to help identify it.</small>

    <button type="submit" class="green">
      <i data-lucide="check-circle"></i>
      Submit Found Item
    </button>
  </form>

</main>

<script>
  lucide.createIcons();
</script>

</body>
</html>
