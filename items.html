<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Upload Item</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { 
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: #f8fafc;
      color: #222;
    }

    header {
      background: #8b0000;
      color: #fff;
      padding: 18px;
      text-align: center;
    }

    header h2 {
      margin: 0;
      font-weight: 700;
    }

    .container {
      max-width: 550px;
      margin: 40px auto;
      padding: 0 16px;
    }

    .info-box {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-left: 5px solid #8b0000;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 25px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.03);
    }

    .info-box p {
      margin: 0;
      font-size: 14.5px;
      color: #555;
      line-height: 1.6;
    }

    .form-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
    }

    label {
      font-size: 14px;
      font-weight: 600;
      display: block;
      margin-top: 15px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-family: inherit;
      font-size: 14px;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #8b0000;
      box-shadow: 0 0 0 3px rgba(139,0,0,0,0.08);
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #8b0000;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s ease;
    }

    button:hover {
      background: #6f0000;
    }

    i[data-lucide] {
      width: 18px;
      height: 18px;
    }

    @media (max-width: 480px) {
      .container {
        margin-top: 25px;
      }
    }
  </style>
</head>
<body>

<header>
  <h2>Admin Upload Item</h2>
</header>

<div class="container">

  <div class="info-box">
    <p>
      Upload found items here as the administrator. These items will be sent to the search page and stored for students to view.
    </p>
  </div>

  <div class="form-card">
    <label>Item Name</label>
    <input type="text" id="itemName" placeholder="e.g. Black Backpack">

    <label>Description</label>
    <textarea id="itemDesc" rows="4" placeholder="Brief description of the item..."></textarea>

    <label>Upload Image</label>
    <input type="file" id="imageInput" accept="image/*">

    <button onclick="sendItem()">
      <i data-lucide="send"></i>
      Submit Item
    </button>
  </div>

</div>

<script>
  lucide.createIcons();

  function sendItem() {
    const name = document.getElementById("itemName").value.trim();
    const desc = document.getElementById("itemDesc").value.trim();
    const file = document.getElementById("imageInput").files[0];

    if (!name || !desc || !file) {
      alert("Please fill all fields.");
      return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
      const item = {
        name: name,
        description: desc,
        image: e.target.result
      };

      localStorage.setItem("newItem", JSON.stringify(item));
      window.location.href = "search.html";
    };

    reader.readAsDataURL(file);
  }
</script>

</body>
</html>
